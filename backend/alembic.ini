[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# env.py always replaces this placeholder with settings.DATABASE_URL. Keeping a
# credential-free value here prevents accidental secret persistence.
sqlalchemy.url = sqlite:///./reknew_orbit.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
